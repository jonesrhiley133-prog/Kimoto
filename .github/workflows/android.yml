name: Android app

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach APKs to tagged releases
    env:
      HAS_KEY: ${{ secrets.KIMOTO_KEYSTORE_BASE64 != '' }}
      KIMOTO_VERSION_CODE: ${{ github.run_number }}
      KIMOTO_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME); Gradle installs the platform it needs.
      - run: echo "sdk.dir=$ANDROID_HOME" > web/android/local.properties

      - run: npm ci
      - name: Build web bundle and sync it into the Android project
        run: npm run android:sync -w web

      - name: Build debug APK
        working-directory: web/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kimoto-debug-apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk

      # Signed release build, only when the signing secrets are configured (see docs/ANDROID.md).
      - name: Decode signing key
        id: key
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KIMOTO_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kimoto.keystore"
          echo "file=$RUNNER_TEMP/kimoto.keystore" >> "$GITHUB_OUTPUT"
      - name: Build signed release APK and App Bundle
        if: ${{ steps.key.outputs.file != '' }}
        working-directory: web/android
        env:
          KIMOTO_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          KIMOTO_KEYSTORE_PASSWORD: ${{ secrets.KIMOTO_KEYSTORE_PASSWORD }}
          KIMOTO_KEY_ALIAS: ${{ secrets.KIMOTO_KEY_ALIAS }}
          KIMOTO_KEY_PASSWORD: ${{ secrets.KIMOTO_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Upload release builds
        if: ${{ steps.key.outputs.file != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: kimoto-release
          path: |
            web/android/app/build/outputs/apk/release/app-release.apk
            web/android/app/build/outputs/bundle/release/app-release.aab

      - name: Attach APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            web/android/app/build/outputs/apk/release/app-release.apk
            web/android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: false
